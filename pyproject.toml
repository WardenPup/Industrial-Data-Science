[project]
name = "industrial-data-science-study"
version = "0.1.0"
description = "Reproducible self-study solutions for Industrial Data Science chapters 10–12"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "matplotlib>=3.9,<4",
    "jupyterlab>=4,<5",
    "notebook>=7,<8",
    "ipykernel>=6,<8",
    "nbconvert[webpdf]>=7,<8",
    "pypdf>=5,<7",
    "nbclient>=0.10,<1",
    "nbformat>=5,<6",
    "pandas>=2.2,<3",
]

[tool.uv]
package = false
