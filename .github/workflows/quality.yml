name: Exercise quality checks

on:
  push:
    branches: ['exercise/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-notebooks:
    # Exercise 14.1 uses the focused job below; legacy exercise checks stay intact.
    if: github.head_ref != 'exercise/14.1' && github.ref != 'refs/heads/exercise/14.1' && github.head_ref != 'exercise/14.2' && github.ref != 'refs/heads/exercise/14.2' && github.head_ref != 'exercise/14.3' && github.ref != 'refs/heads/exercise/14.3' && github.head_ref != 'exercise/14.4' && github.ref != 'refs/heads/exercise/14.4' && github.head_ref != 'exercise/15.1' && github.ref != 'refs/heads/exercise/15.1' && github.head_ref != 'exercise/15.2' && github.ref != 'refs/heads/exercise/15.2' && github.head_ref != 'exercise/15.3' && github.ref != 'refs/heads/exercise/15.3' && github.head_ref != 'exercise/15.4' && github.ref != 'refs/heads/exercise/15.4' && github.head_ref != 'exercise/16.1' && github.ref != 'refs/heads/exercise/16.1' && github.head_ref != 'exercise/16.2' && github.ref != 'refs/heads/exercise/16.2' && github.head_ref != 'exercise/16.3' && github.ref != 'refs/heads/exercise/16.3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright
      JUPYTER_CONFIG_DIR: ${{ github.workspace }}/.jupyter
      JUPYTER_DATA_DIR: ${{ github.workspace }}/.local/share/jupyter
      JUPYTER_RUNTIME_DIR: ${{ github.workspace }}/.local/share/jupyter/runtime
      IPYTHONDIR: ${{ github.workspace }}/.local/ipython
      MPLCONFIGDIR: ${{ github.workspace }}/.tools/matplotlib
      QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned uv and locked environment
        run: |
          python -m pip install uv==0.13.5
          uv sync --locked
      - name: Check new commit disclosure format
        run: uv run --locked python scripts/check_commit_messages.py --base origin/main --head "$QA_HEAD"
      - name: Run numerical and QA tests
        # Raw data are deliberately not committed; fetch the checksum-pinned source.
        # The notebook itself executes offline after this explicit acquisition step.
        run: |
          uv run --locked python scripts/download_ai4i.py
          uv run --locked python scripts/download_production.py
          uv run --locked python scripts/download_gestures.py
          uv run --locked python scripts/download_uwave.py
          uv run --locked python scripts/download_appliances.py
          uv run --locked python -m unittest discover -s tests -v
      - name: Execute Exercise 10.1
        run: uv run --locked python sessions/ch10/aufgabe_10_1.py --output outputs/tooling-smoke/heart.png
      - name: Validate and execute tracked notebooks if present
        run: uv run --locked python scripts/validate_notebooks.py
      - name: Install notebook PDF browser
        run: uv run --locked playwright install --with-deps chromium
      - name: Execute synthetic notebook and verify HTML/PDF exports
        run: uv run --locked python scripts/check_notebook_tools.py
      - name: Execute Exercise 10.2 and verify required exports
        run: uv run --locked python scripts/build_exercise_10_2.py
      - name: Execute Exercise 10.3 and verify all required plots and HTML
        run: uv run --locked python scripts/build_exercise_10_3.py
      - name: Execute Exercise 11.1 and verify gap preservation and HTML
        run: |
          uv run --locked python scripts/build_exercise_11_1.py
          uv run --locked python scripts/check_exercise_11_1_review.py
      - name: Execute Exercise 11.2 and verify imputation outputs and offline HTML
        run: |
          uv run --locked python scripts/build_exercise_11_2.py
          uv run --locked python scripts/check_exercise_11_2_html.py
          uv run --locked python scripts/check_exercise_11_2_review.py
      - name: Execute Exercise 11.3 and verify STL stages and offline HTML
        run: |
          uv run --locked python scripts/build_exercise_11_3.py
          uv run --locked python scripts/check_exercise_11_3_html.py
          uv run --locked python scripts/check_exercise_11_3_review.py
      - name: Execute Exercise 11.4 and verify original-data outliers and offline HTML
        run: |
          uv run --locked python scripts/build_exercise_11_4.py
          uv run --locked python scripts/check_exercise_11_4_html.py
          uv run --locked python scripts/check_exercise_11_4_review.py
      - name: Execute Exercise 12.1 and verify clustering splits and offline HTML
        run: |
          uv run --locked python scripts/build_exercise_12_1.py
          uv run --locked python scripts/check_exercise_12_1_html.py
          uv run --locked python scripts/check_exercise_12_1_review.py
      - name: Execute Exercise 12.2 and verify classification metrics and offline HTML
        run: |
          uv run --locked python scripts/build_exercise_12_2.py
          uv run --locked python scripts/check_exercise_12_2_html.py
