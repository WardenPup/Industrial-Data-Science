<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15.3 – Parallelkoordinaten</title>
<style>body{font:15px Arial;margin:16px;color:#202020}select,button{font:inherit;padding:5px}#scroll{overflow-x:auto;max-width:100%}#chart{width:1400px;height:610px}#status{min-height:2.5em}p{line-height:1.4}</style>
<h2>XAI Drilling: interaktive Fehlermuster</h2>
<label>Fehlerflag: <select id="target">__OPTIONS__</select></label> <button id="reset">Auswahl zurücksetzen</button>
<p>Achsentitel ziehen zum Umordnen. Auf einer Achse einen Bereich ziehen zum Filtern; mehrere Achsen kombinieren. Material bestimmt die Linienfarbe. Flag 0 bedeutet nur „dieser Fehler nicht markiert“. Mehrere Fehlerarten können gleichzeitig markiert sein.</p>
<div id="scroll"><div id="chart"></div></div><p id="status" role="status"></p>
<script>__PLOTLY_JS__</script><script>
const spec=__FIGURE__, flags=__FLAGS__, chart=document.getElementById('chart'), choice=document.getElementById('target');
function selectedRows(){let dims=chart.data[0].dimensions;return Array.from({length:20000},(_,i)=>i).filter(i=>dims.every(d=>{if(!d.constraintrange||!d.constraintrange.length)return true;let rs=Array.isArray(d.constraintrange[0])?d.constraintrange:[d.constraintrange];return rs.some(r=>d.values[i]>=Math.min(...r)&&d.values[i]<=Math.max(...r));}));}
function report(){let ids=selectedRows(),materials={P:0,K:0,N:0},dims=chart.data[0].dimensions,d=dims.find(d=>d.name==='Material');ids.forEach(i=>materials[['P','K','N'][d.values[i]]]++);let failures={};Object.keys(flags).forEach(f=>failures[f]=ids.filter(i=>flags[f][i]===1).length);let bounds={};dims.filter(d=>!['Material','Drill Bit Type','failure'].includes(d.name)).forEach(d=>{let vs=ids.map(i=>d.values[i]);bounds[d.name]=vs.length?[Math.min(...vs),Math.max(...vs)]:null;});document.getElementById('status').textContent=`Ausgewählt: ${ids.length} / 20000; ${choice.value}=1: ${failures[choice.value]}; Material P/K/N: ${materials.P}/${materials.K}/${materials.N}. Mitmarkierungen BEF/CCF/FWF/WDF: ${failures.BEF}/${failures.CCF}/${failures.FWF}/${failures.WDF}. Keine Ausfallwahrscheinlichkeit.`;window.selectionReport={rows:ids.length,positive:failures[choice.value],materials,failures,bounds};}
Plotly.newPlot(chart,spec.data,spec.layout,{displayModeBar:false,responsive:false}).then(()=>{chart.on('plotly_restyle',report);report();window.chartReady=true;});
choice.addEventListener('change',()=>{let dims=chart.data[0].dimensions.map(d=>{let result={...d};delete result.constraintrange;if(d.name==='failure'){result.values=flags[choice.value];result.label=choice.value;}return result;});Plotly.restyle(chart,{dimensions:[dims]}).then(report);});
document.getElementById('reset').addEventListener('click',()=>{let dims=chart.data[0].dimensions.map(d=>{let r={...d};delete r.constraintrange;return r;});Plotly.restyle(chart,{dimensions:[dims]}).then(report);});
</script></html>
